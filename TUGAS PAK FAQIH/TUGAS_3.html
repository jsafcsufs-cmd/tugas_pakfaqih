<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Absensi</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 40px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
        }

        th, td {
            border: 1px solid black;
            text-align: center;
            padding: 8px;
            font-size: 16px;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>
<body>

    </table>

</body>
</html>
